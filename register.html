<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteIt! - Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrap">
    <header>
        <nav>
            <div class="logo">Note<span class="highlight">It!</span></div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html" class="active">Register</a></li>
                <li><a href="login.html">Sign In</a></li>
            </ul>
        </nav>
    </header>

    <div class="login">
        <div class="login-container">
            <h1 class="logo-centered">Note<span class="highlight">It!</span></h1>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
                <div class="btn-container">
                    <button type="submit" class="btn-centered">Register</button>
                </div>
                <div class="form-options">
                    <p>Already have an account? <a href="login.html">Sign In</a></p>
                </div>
            </form>
            <div id="message" class="message"></div>
        </div>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    formData.append('action', 'register');
    
    const messageDiv = document.getElementById('message');
    messageDiv.innerHTML = 'Registering...';
    messageDiv.className = 'message info';
    
    try {
        const response = await fetch('api/auth.php', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
            messageDiv.innerHTML = result.message;
            messageDiv.className = 'message success';
            setTimeout(() => {
                window.location.href = 'admin.html';
            }, 1500);
        } else {
            messageDiv.innerHTML = result.message;
            messageDiv.className = 'message error';
        }
    } catch (error) {
        messageDiv.innerHTML = 'Registration failed. Please try again.';
        messageDiv.className = 'message error';
    }
});
</script>

<style>
.message {
    margin-top: 15px;
    padding: 10px;
    border-radius: 5px;
    text-align: center;
}

.message.success {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}

.message.error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}

.message.info {
    background-color: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
}

.form-options p {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    color: #666;
}

.form-options a {
    color: #00bfa5;
    text-decoration: none;
}

.form-options a:hover {
    text-decoration: underline;
}
</style>
</body>
</html>
